name: whmrqst

services:
  web:
    image: whmrqst-django
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    command: >
      sh -c "python manage.py migrate &&
      gunicorn questbetween.wsgi:application --bind 0.0.0.0:8000 --workers ${WEB_WORKERS:-2}"
    restart: unless-stopped
    ports:
      - "${PROD_PORT:-8000}:8000"
    environment:
      - DJANGO_DEBUG=false
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-questbetween}
      - POSTGRES_USER=${POSTGRES_USER:-questbetween}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_CONNECT_TIMEOUT=${POSTGRES_CONNECT_TIMEOUT:-5}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_network_prod
      - default

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-questbetween}
      - POSTGRES_USER=${POSTGRES_USER:-questbetween}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-questbetween} -d ${POSTGRES_DB:-questbetween}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal_network_prod

volumes:
  postgres_data_prod:

networks:
  internal_network_prod:
    internal: true
