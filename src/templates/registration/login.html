{% extends "base.html" %}

{% block title %}Sign In · Quest Between{% endblock %}

{% block content %}
<section class="panel panel-elevated auth-panel">
    <h1 class="heading-xl">Sign in</h1>
    {% if form.errors %}
    <p class="message message--error" role="alert">The username or password was not recognised.</p>
    {% endif %}
    <form method="post" class="stacked-form">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <label for="id_username">Username</label>
        <input id="id_username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="id_password">Password</label>
        <input id="id_password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
</section>
{% endblock %}
