name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: questbetween
          POSTGRES_USER: questbetween
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U questbetween -d questbetween"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-test-secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: questbetween
      POSTGRES_USER: questbetween
      POSTGRES_PASSWORD: ci-postgres-password
      QUESTBETWEEN_TEST_DATABASE: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check migrations are committed
        run: python manage.py makemigrations --check --dry-run --settings=questbetween.settings_test

      - name: Check lint, formatting, and types
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy

      - name: Run pytest suite
        run: python -m pytest -q

      - name: Run tests
        run: python manage.py test campaign --settings=questbetween.settings_test
